[strategic_vision]
vision = "Transform Porter into the world's leading data migration platform"
mission = "Enable organizations to seamlessly transform and migrate data between any systems"
target_market = "Enterprise customers, developers, and data migration professionals"
competitive_advantage = "Rust performance, comprehensive features, and extensible architecture"
success_metrics = "100+ enterprise customers, $1M+ ARR, 1000+ GitHub stars by end of 2024"

[engineering_policies]
dry_principle = "All code must follow DRY. Factor shared logic into modules, avoid duplication, and delete unused code promptly."
dead_code_policy = "Unused functions, types, and modules must be removed; CI enforces dead-code checks."
testing_policy = "Unit and integration tests are required for all areas. Maintain ≥ 75% combined coverage."
coverage_enforcement = "CI fails if coverage drops below threshold or new/changed code lacks tests."
style_guidelines = "Prefer clear, idiomatic Rust; async via tokio; structured concurrency; bounded channels; error handling with anyhow/thiserror."
