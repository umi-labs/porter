# Example Porter Configuration with Multiple Collections
# This shows how to configure multiple collections, each with their own source data and schema files

source = "umbraco"
target = "payload"
output = "./seed"

# Collection configurations
[[collections]]
name = "hotels"
source_data = "./test-data/hotels-umbraco.json"
collection_path = "./test-data/hotels.ts"
locale = "en"
related_collections = ["amenities", "reviews"]

[[collections]]
name = "pages"
source_data = "./test-data/pages-umbraco.json"
collection_path = "./test-data/pages.ts"
locale = "en"
related_collections = ["navigation", "seo"]

[[collections]]
name = "amenities"
source_data = "./test-data/amenities-umbraco.json"
collection_path = "./test-data/amenities.ts"
locale = "en"

[[collections]]
name = "reviews"
source_data = "./test-data/reviews-umbraco.json"
collection_path = "./test-data/reviews.ts"
locale = "en"
related_collections = ["hotels", "users"]

# Global settings
interactive = true
verbose = true
dry_run = false
debug = false
fixtures = false

# Optional metadata
[metadata]
project = "Hotel Website Migration"
version = "1.0.0"
description = "Migration from Umbraco to Payload CMS"
