# Dev services only (Postgres 17 + MinIO). Production compose is Task 15.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: porter
      POSTGRES_PASSWORD: porter
      POSTGRES_DB: porter
    ports: ["55439:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porter -d porter"]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    # minio/minio is gone from Docker Hub (and quay needs auth); pinned by digest to RELEASE.2026-10-23T20-06-51Z.
    image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: porter-dev
      MINIO_ROOT_PASSWORD: porter-dev-secret
    ports: ["59100:9000", "59101:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  dbdata:
  miniodata:
