[package]
name = "porter-desktop"
description = "Native desktop app for Porter, built on GPUI."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
publish = false

[dependencies]
porter-engine = { path = "../porter-engine" }
porter-model.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
chrono.workspace = true
uuid.workspace = true
open = "5"
anyhow.workspace = true
libc = "0.2"
indexmap.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "6"
# Thumbnails: only the formats sites actually hold. gpui already builds this crate.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Pinned exactly: GPUI is pre-1.0 and breaks its API between releases. See README.md before bumping.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"

[dev-dependencies]
tempfile.workspace = true

# `cargo build --release -p porter-desktop && cargo packager -p porter-desktop --release`
# -> Porter.app and a .dmg in target/packager.
[package.metadata.packager]
product-name = "Porter"
identifier = "uk.co.umidigital.porter"
formats = ["app", "dmg"]
binaries = [{ path = "porter-desktop", main = true }]
out-dir = "../../target/packager"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Ad-hoc signed only ("-"): no Developer ID yet, so the app isn't notarised.
signing-identity = "-"
