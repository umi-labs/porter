[package]
name = "porter-cli"
description = "Porter is a CLI for migrating content between CMS platforms."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[[bin]]
name = "porter"
path = "src/main.rs"

[dependencies]
porter-engine = { path = "../porter-engine" }
porter-model.workspace = true
porter-tui = { path = "../porter-tui" }
clap = { workspace = true }
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
self_update = { version = "1.3.3", default-features = false, features = ["github", "reqwest", "rustls", "archive-tar", "compression-tar-xz", "archive-zip", "compression-zip-deflate"] }
sha2.workspace = true
tempfile.workspace = true
self-replace = "1"
reqwest.workspace = true
keyring.workspace = true
toml.workspace = true
toml_edit.workspace = true
url.workspace = true
futures.workspace = true
tar = "0.4"
zstd = "0.13"
base64 = "0.22"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
wiremock.workspace = true
