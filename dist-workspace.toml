[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.29.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A GitHub repo to push Homebrew formulas to
tap = "umi-labs/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]

# Custom GitHub runners configuration
[dist.github-custom-runners]
# For Linux builds - use faster Blacksmith runners
"aarch64-unknown-linux-gnu" = "blacksmith-4vcpu-ubuntu-2204"
"x86_64-unknown-linux-gnu" = "blacksmith-4vcpu-ubuntu-2204"

# For macOS builds - Blacksmith also offers macOS runners
"aarch64-apple-darwin" = "blacksmith-4vcpu-macos-14"
"x86_64-apple-darwin" = "blacksmith-4vcpu-macos-13"

# For Windows builds - you can use Blacksmith Windows runners too
"x86_64-pc-windows-msvc" = "blacksmith-4vcpu-windows-2022"

# Set a default for any jobs not tied to specific targets
global-task-runner = "blacksmith-4vcpu-ubuntu-2204"