[workspace]
resolver = "3"
members = ["crates/*"]
# 1.x code kept for reference only; deleted in the last phase-1 task.
exclude = ["legacy"]

[workspace.package]
version = "2.0.0"
edition = "2024"
repository = "https://github.com/umi-labs/porter"
license = "MIT"
authors = ["Isaac <isaac@umidigital.co.uk>"]
homepage = "https://github.com/umi-labs/porter"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.42", features = ["bundled"] }
toml = "1"
url = "2"
percent-encoding = "2"
tempfile = "3"
sha2 = "0.10"
async-trait = "0.1"
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
wiremock = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
assert_cmd = "2"
predicates = "3"
maud = "0.27"
scraper = "0.23"
quick-xml = "0.37"
globset = "0.4"
regex = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
porter-model = { path = "crates/porter-model" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
