[package]
name = "porter"
version = "1.0.9"
edition = "2024"
repository = "https://github.com/umi-labs/porter"
description = "Porter is a high-performance, Rust-based CLI tool for migrating structured content between different systems. It supports complex nested data structures, parallel processing, and provides an intuitive interactive interface for data transformation."
license = "MIT"
authors = ["Isaac <isaac@umidigital.co.uk>"]
homepage = "https://github.com/umi-labs/porter"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
thiserror = "1"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
colored = "2"
regex = "1"
log = "0.4"
env_logger = "0.11"
indexmap = "2"
rayon = "1.10"
glob = "0.3"
walkdir = "2.5"
libloading = "0.8"
swc_ecma_parser = "0.141.37"
swc_ecma_ast = "0.110.15"
swc_common = { version = "0.33.12", features = ["tty-emitter"] }
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16"
futures = "0.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3.8"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
