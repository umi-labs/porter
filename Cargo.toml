[workspace]
resolver = "3"
members = ["crates/*"]
# 1.x code kept for reference only; deleted in the last phase-1 task.
exclude = ["legacy"]

[workspace.package]
version = "2.0.0"
edition = "2024"
repository = "https://github.com/umi-labs/porter"
license = "MIT"
authors = ["Isaac <isaac@umidigital.co.uk>"]
homepage = "https://github.com/umi-labs/porter"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
